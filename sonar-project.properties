sonar.projectKey=ds-rd
sonar.projectName=ds-rd
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Sem .sonarignore oficial. SCM respeita .gitignore; exclusions são o controle real.
sonar.scm.exclusions.disabled=false
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.scannerwork/**,**/*.d.ts
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
